
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>🎯 Jogo de Adivinhação</h1>

        <p>
            Estou pensando em um número entre 1 e 100.
            Você consegue descobrir?
        </p>

        <input type="number" id="palpite"
            placeholder="Digite seu palpite" min="1" max="100">

        <button id="btnAdivinhar">Adivinhar</button>

        <p id="mensagem">Boa sorte!</p>
        <p id="tentativas">Tentativas: 0</p>

        <button id="btnReiniciar">Novo jogo</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
